type: costume
compression: none
data:
  sprites: 
    sheet: alice.png
    width: 32
    height: 48
  animations:
    - action: idle
      dir: right
      frames:
      - row: 2
        columns: [0]
        duration: 1000
    - action: idle
      dir: left
      flip: true
      frames:
      - row: 2
        columns: [0]
        duration: 1000
    - action: walk
      dir: right
      frames:
      - row: 1
        columns: [0,1,2,3,4]
        duration: 100
    - action: walk
      dir: left
      flip: true
      frames:
      - row: 1
        columns: [0,1,2,3,4]
        duration: 100
    - action: speak
      dir: right
      frames:
      - row: 2
        columns: [0,1,2]
        duration: 100
    - action: speak
      dir: left
      flip: true
      frames:
      - row: 2
        columns: [0,1,2]
        duration: 100
    - action: walk
      dir: down
      frames:
      - row: 0
        columns: [0,1,2,3]
        duration: 100
    - action: checkwatch # faces left
      flip: true
      frames:
      - row: 3
        columns: [0,1,2,3,3,3,2,1,0]
        duration: 150
